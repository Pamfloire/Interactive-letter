<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Letter For You 💌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Instruction text for phone users -->
  <div class="instruction">Tap the envelope to open ✨</div>

  <div class="envelope-wrapper" id="envelopeWrapper">
    <div class="envelope">
      <div class="flap"></div>
      <div class="front-left"></div>
      <div class="front-right"></div>
      
      <!-- The Hidden Letter inside -->
      <div class="letter">
        <div class="heart-icon">💝</div>
        <p class="letter-text">
          Hey handsome darlingo,<br><br>
          Just a little digital reminder that you mean the absolute world to me. Thank you for always being so patient with me, understanding and being the best boyfriend ever. <br><br>
          I love you tons! 💕😻
        </p>
      </div>
    </div>
    <!-- Heart sticker that seals the envelope -->
    <div class="heart-sticker">❤️</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
